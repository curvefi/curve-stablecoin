[project]
name = "curve-stablecoin"
version = "2.0.0"
description = "Curve Stablecoin contracts and tests"
readme = "README.md"
requires-python = ">=3.10,<4"
authors = [
    { name = "Michael Egorov", email = "michael@curve.fi" }
]

dependencies = [
    "vyper==0.4.3",
    "snekmate>=0.1.1",
    "curve-std",
    "boa-solidity",
    "stableswap-ng",
]

[dependency-groups]
dev = [
    "titanoboa",
    "hypothesis>=6.99.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5",
    "pytest-forked>=1.6.0",
    "pytest-cov>=4.0.0",
    "pytest-profiling>=1.8.1",
    "pre-commit==4.3.0",
    "z3-solver>=4.12.0",
    "curve-dao",
]

[tool.uv]
# curve-dao pins its own titanoboa rev; keep the repo's pin everywhere.
override-dependencies = ["titanoboa"]

[tool.uv.sources]
titanoboa = { git = "https://github.com/vyperlang/titanoboa", rev = "ed81f209bc407fe4c990d4875dcd4106e976a27f" }
curve-std = { git = "https://github.com/curvefi/curve-std", rev = "main" }
boa-solidity = { git = "https://github.com/z80dev/boa-solidity", rev = "main" }
stableswap-ng = { git = "https://github.com/curvefi/stableswap-ng", rev = "7a9f6f11fb67e4778fb2496e65a09ec2939e339c" }
curve-dao = { git = "https://github.com/heswithme/curve-dao", rev = "03697aebafb016ad297eb5036498c39eead88370" }


[tool.ruff.lint]
select = ["TID252"]
ignore = [
    # Should be eventually fixed
    "E722" ,
    "F821"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curve_stablecoin", "tests"]
